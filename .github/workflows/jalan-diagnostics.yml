name: Jalan diagnostic router checks
on:
  push:
    branches:
      - dev/jalan-routing-diagnostics
      - main
    paths:
      - 'server/jalan/routing-diagnostics.js'
      - 'server/jalan/routing-diagnostics.test.js'
      - 'server/jalan/routes.js'
      - '.github/workflows/jalan-diagnostics.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check server/app.js
          node --check server/jalan/routes.js
          node --check server/jalan/routing-diagnostics.js
          node --check server/jalan/routing-diagnostics.test.js
      - name: Install isolated test dependencies
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund express@4 mongoose@8
      - name: Validate diagnostics without MongoDB writes
        run: node server/jalan/routing-diagnostics.test.js
