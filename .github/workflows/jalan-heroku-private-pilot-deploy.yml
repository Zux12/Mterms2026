name: JALAN private Heroku pilot deployment

# A merge/push is not release approval. Deploy the private pilot only by
# explicitly dispatching this workflow on the established trusted branch.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jalan-heroku-private-pilot-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/jalan-v4102-routing-regression-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
      JALAN_READONLY_MONGODB_URI: ${{ secrets.JALAN_READONLY_MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify narrowly scoped experimental entrypoint
        shell: bash
        run: |
          # The GitHub branch must retain the production-safe entrypoint.
          test "$(cat Procfile)" = "web: node server/app.js"
          node --check server/jalan/run-kl-preview-railway.js
          node --check server/jalan/configure-heroku-private-pilot.js
          test -n "$HEROKU_API_KEY"
          test -n "$JALAN_READONLY_MONGODB_URI"
      - name: Configure JALAN pilot credentials only (never mterm2026)
        run: node server/jalan/configure-heroku-private-pilot.js
      - name: Record pre-push Heroku release baseline (non-secret)
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          (async()=>{
            const r=await fetch('https://api.heroku.com/apps/jalan-kl-private-pilot/releases',{
              headers:{Authorization:'Bearer '+process.env.HEROKU_API_KEY,
                Accept:'application/vnd.heroku+json; version=3'},
              signal:AbortSignal.timeout(15000),redirect:'error'});
            if(!r.ok)throw Error('Heroku releases lookup HTTP '+r.status);
            const rows=await r.json();
            if(!Array.isArray(rows)||!rows.length)throw Error('Missing Heroku release baseline');
            const latest=rows.reduce((a,b)=>Number(a.version)>Number(b.version)?a:b);
            if(!Number.isInteger(latest.version)||!latest.id||!latest.slug?.id)
              throw Error('Invalid Heroku release or missing baseline code slug');
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'jalan-pilot-release-baseline.json'),
              JSON.stringify({id:latest.id,version:latest.version,slugId:latest.slug.id}),
              {mode:0o600,flag:'wx'});
            console.log('Captured previous Heroku release version '+latest.version);
          })().catch(e=>{console.error(String(e.message).slice(0,150));process.exitCode=1});
          NODE
      - name: Deploy experimental branch to dedicated Heroku Git remote
        shell: bash
        run: |
          set -euo pipefail
          # Override the Heroku entrypoint only inside this disposable runner.
          # Never commit the pilot Procfile back to GitHub or change MTERMS2026.
          printf '%s\n' 'web: node server/jalan/run-kl-preview-railway.js' > Procfile
          test "$(cat Procfile)" = "web: node server/jalan/run-kl-preview-railway.js"
          git add -- Procfile
          git -c user.name='JALAN Pilot CI' -c user.email='jalan-pilot-ci@users.noreply.github.com' commit -m 'Heroku-only: isolated KL pilot entrypoint'
          # This temporary Procfile commit is the exact SHA pushed to Heroku,
          # not the source branch SHA; record it for verified slug provenance.
          git rev-parse HEAD > "$RUNNER_TEMP/jalan-expected-heroku-commit"
          askpass="$RUNNER_TEMP/jalan-heroku-askpass.sh"
          cat > "$askpass" <<'SCRIPT'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'heroku';;
            *Password*) printf '%s\n' "$HEROKU_API_KEY";;
            *) exit 1;;
          esac
          SCRIPT
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git push --force https://git.heroku.com/jalan-kl-private-pilot.git HEAD:refs/heads/main
          rm -f "$askpass"
      - name: Verify canonical private pilot URL rejects anonymous visitors
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          (async () => {
            const r=await fetch('https://api.heroku.com/apps/jalan-kl-private-pilot',{
              headers:{Authorization:'Bearer '+process.env.HEROKU_API_KEY,
                Accept:'application/vnd.heroku+json; version=3'},
              signal:AbortSignal.timeout(15000)});
            if(!r.ok)throw Error('Heroku app lookup failed with HTTP '+r.status);
            const app=await r.json();
            const url=new URL(app.web_url);
            if(url.protocol!=='https:'||!/^[a-z0-9-]+\.herokuapp\.com$/.test(url.hostname))
              throw Error('Heroku canonical domain mismatch');
            console.log('Checking Heroku canonical domain '+url.hostname);
            let last='none';
            for(let i=0;i<18;i++){
              try{
                const check=await fetch(url.origin+'/',{
                  signal:AbortSignal.timeout(12000),redirect:'manual'});
                last=String(check.status);
                if(check.status===401){
                  console.log('Private pilot responds with expected HTTP 401 to anonymous visitors.');
                  return;
                }
              }catch{last='unreachable';}
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw Error('Pilot did not reject anonymous visitors as expected; last status '+last);
          })().catch(e=>{
            console.error('Private deployment verification failed: '+String(e.message).slice(0,170));
            process.exitCode=1;
          });
          NODE
      - name: Confirm newer successful Heroku release (read-only)
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const filename=path.join(process.env.RUNNER_TEMP,'jalan-pilot-release-baseline.json');
          (async()=>{
            const base=JSON.parse(fs.readFileSync(filename,'utf8'));
            let latest=null;
            for(let i=0;i<18;i++){
              const r=await fetch('https://api.heroku.com/apps/jalan-kl-private-pilot/releases',{
                headers:{Authorization:'Bearer '+process.env.HEROKU_API_KEY,
                  Accept:'application/vnd.heroku+json; version=3'},
                signal:AbortSignal.timeout(15000),redirect:'error'});
              if(!r.ok)throw Error('Heroku release status HTTP '+r.status);
              const rows=await r.json();
              if(!Array.isArray(rows)||!rows.length)throw Error('Missing Heroku release result');
              latest=rows.reduce((a,b)=>Number(a.version)>Number(b.version)?a:b);
              if(!Number.isInteger(latest.version)||!latest.id)
                throw Error('Malformed Heroku release status');
              // A config-only release may advance the version without deploying code.
              // Require a genuinely different slug before accepting this Git push.
              if(latest.version>base.version&&latest.id!==base.id&&
                 latest.slug?.id&&latest.slug.id!==base.slugId){
                if(latest.status==='succeeded'){
                  // Compare Heroku's deployed slug identity against the exact
                  // runner commit pushed to the dedicated Heroku Git remote.
                  const expected=fs.readFileSync(path.join(process.env.RUNNER_TEMP,
                    'jalan-expected-heroku-commit'),'utf8').trim();
                  if(!/^[a-f0-9]{40}$/.test(expected))throw Error('Missing expected Git SHA');
                  const slugResponse=await fetch(
                    'https://api.heroku.com/apps/jalan-kl-private-pilot/slugs/'+encodeURIComponent(latest.slug.id),{
                      headers:{Authorization:'Bearer '+process.env.HEROKU_API_KEY,
                        Accept:'application/vnd.heroku+json; version=3'},
                      signal:AbortSignal.timeout(15000),redirect:'error'});
                  if(!slugResponse.ok)throw Error('Heroku slug metadata HTTP '+slugResponse.status);
                  const slug=await slugResponse.json();
                  if(slug.id!==latest.slug.id||!slug.commit||slug.commit!==expected)
                    throw Error('New Heroku slug Git SHA does not match pushed revision');
                  console.log('Verified new Heroku pilot release: version '+latest.version+
                    ', release ID '+latest.id+', status succeeded');
                  return;
                }
                if(latest.status==='failed')throw Error('New Heroku release failed');
              }
              await new Promise(resolve=>setTimeout(resolve,10000));
            }
            throw Error('No newer succeeded code-slug release than baseline '+base.version);
          })().catch(e=>{console.error(String(e.message).slice(0,170));process.exitCode=1});
          NODE
      - name: Remove release baseline file
        if: always()
        run: rm -f "$RUNNER_TEMP/jalan-pilot-release-baseline.json" "$RUNNER_TEMP/jalan-expected-heroku-commit"
      # The independent trusted-branch smoke job can finish before deployment.
      # Validate the newly deployed revision, not merely the preceding release.
      - name: Verify authenticated private pilot after deployed revision
        run: node server/jalan/smoke-heroku-private-pilot.js
      - name: Install browser dependencies for private mobile acceptance
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Verify authenticated 390px private mobile pilot after deployed revision
        run: node server/jalan/smoke-heroku-private-mobile.js
