name: Oil and Gas recognition checks
on:
  push:
    paths:
      - 'server/oilandgas/recognition.js'
      - 'tests/oilandgas-recognition.test.js'
      - 'tests/oilandgas-recognition-policy.test.js'
      - 'server/oilandgas/recognition-policy.js'
      - 'server/oilandgas/recognition-review.js'
      - 'server/oilandgas/recognition-evidence.js'
      - 'server/oilandgas/recognition-admin-alert.js'
      - 'server/oilandgas/recognition-rules.js'
      - 'server/oilandgas/recognition-source.js'
      - 'server/oilandgas/recognition-integrity.js'
      - 'server/oilandgas/recognition-letter-verification.js'
      - 'tests/oilandgas-recognition-qr-verification.test.js'
      - 'tests/oilandgas-recognition-simulation.test.js'
      - 'tests/oilandgas-recognition-integrity.test.js'
      - 'tests/oilandgas-recognition-rules.test.js'
      - 'tests/oilandgas-recognition-source.test.js'
      - 'tests/oilandgas-recognition-admin-alert.test.js'
      - 'tests/oilandgas-recognition-evidence.test.js'
      - 'tests/oilandgas-recognition-review.test.js'
      - 'tests/oilandgas-recognition-selector.test.js'
      - 'server/oilandgas/recognition-selector.js'
      - 'server/oilandgas/recognition-related-review.js'
      - 'tests/oilandgas-recognition-related-review.test.js'
      - 'tests/oilandgas-recognition-letter-tracking.test.js'
      - 'server/oilandgas/desk/recognition.html'
      - '.github/workflows/recognition-tests.yml'
  workflow_dispatch:
jobs:
  recognition-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install application dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Check recognition module syntax
        run: |
          node --check server/oilandgas/recognition.js
          node --check server/oilandgas/recognition-policy.js
          node --check server/oilandgas/recognition-review.js
          node --check server/oilandgas/recognition-rules.js
          node --check server/oilandgas/recognition-source.js
          node --check server/oilandgas/recognition-integrity.js
          node --check server/oilandgas/recognition-letter-verification.js
          node --check server/oilandgas/recognition-evidence.js
          node --check server/oilandgas/recognition-admin-alert.js
          node --check server/oilandgas/recognition-selector.js
          node --check server/oilandgas/recognition-related-review.js
      - name: Run recognition safety and scoring tests
        run: node --test tests/oilandgas-recognition.test.js tests/oilandgas-recognition-policy.test.js tests/oilandgas-recognition-review.test.js tests/oilandgas-recognition-selector.test.js tests/oilandgas-recognition-letter-tracking.test.js tests/oilandgas-recognition-evidence.test.js tests/oilandgas-recognition-admin-alert.test.js tests/oilandgas-recognition-rules.test.js tests/oilandgas-recognition-source.test.js tests/oilandgas-recognition-integrity.test.js tests/oilandgas-recognition-qr-verification.test.js tests/oilandgas-recognition-simulation.test.js tests/oilandgas-recognition-related-review.test.js
