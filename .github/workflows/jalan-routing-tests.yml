name: Jalan routing regression tests
on:
  workflow_dispatch:
  push:
    branches: [jalan-v4102-routing-regression-tests]
  pull_request:
    paths:
      - 'server/jalan/**'
      - '.github/workflows/jalan-routing-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server/jalan/run-kl-local-readonly.js
      - run: node --test server/jalan/kl-real-imported-subgraph-v4102.test.js server/jalan/kl-segment-v4102*.test.js server/jalan/kl-via-way-audit-v4102.test.js server/jalan/kl-via-way-only-exit-v4102.test.js server/jalan/kl-edge-identity-v4102.test.js server/jalan/validate-kl-pilot.test.js server/jalan/collect-kl-route-evidence.test.js
      - name: Validate production diagnostics without database writes
        run: |
          node --check server/jalan/routes.js
          node --check server/jalan/routing-diagnostics.js
          node server/jalan/routing-diagnostics.test.js

  kl-fullgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JALAN_READONLY_MONGODB_URI: ${{ secrets.JALAN_READONLY_MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify dedicated read-only connection is configured
        shell: bash
        run: |
          if [ -z "$JALAN_READONLY_MONGODB_URI" ]; then
            echo "Missing JALAN_READONLY_MONGODB_URI repository secret; no database connection attempted."
            exit 1
          fi
      - name: Create public OSM-node smoke case (not private GPS)
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          fs.writeFileSync('/tmp/jalan-kl-cases.json',JSON.stringify([{
            caseId:'osm_kl_directed_smoke_001',journeyType:'short-urban',
            expectedReachable:true,
            startLat:3.1315707,startLng:101.7038508,
            endLat:3.1314573,endLng:101.7038951
          }]),{mode:0o600,flag:'wx'});
          NODE
      - name: Run full-graph smoke case (partial 20-case acceptance is expected)
        shell: bash
        run: |
          set +e
          node server/jalan/run-kl-local-readonly.js /tmp/jalan-kl-cases.json /tmp/jalan-kl-sanitized.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected partial-evidence exit 2 for one-case smoke test; received $code"
            exit 1
          fi
          node - <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/jalan-kl-sanitized.json','utf8'));
          const r=rows[0];
          if(rows.length!==1||r.caseId!=='osm_kl_directed_smoke_001'||
             r.ok!==true||r.responseStatus!==200||r.routeModeVerified!==true||
             r.geometryContinuous!==true||r.geometryMetricsVerified!==true||
             !Number.isFinite(r.distanceMeters)||r.distanceMeters<0||
             r.graphCacheHit!==false||!Number.isFinite(r.serverTotalMs))
             throw Error('Full-graph smoke evidence did not meet the expected route contract');
          console.log('Full-graph KL smoke route passed; distance metres:',r.distanceMeters);
          console.log('Graph load ms:',r.graphLoadMs,'server total ms:',r.serverTotalMs);
          console.log('Partial evidence only; 20-case manual acceptance remains pending.');
          NODE
      - name: Remove private local inputs and sanitized evidence
        if: always()
        run: rm -f /tmp/jalan-kl-cases.json /tmp/jalan-kl-sanitized.json
