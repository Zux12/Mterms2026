name: Jalan routing regression tests
on:
  workflow_dispatch:
  push:
    branches: [jalan-v4102-routing-regression-tests]
  pull_request:
    paths:
      - 'server/jalan/**'
      - '.github/workflows/jalan-routing-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: node --check server/jalan/run-kl-local-readonly.js
      - run: node --test server/jalan/kl-real-imported-subgraph-v4102.test.js server/jalan/kl-segment-v4102*.test.js server/jalan/kl-via-way-audit-v4102.test.js server/jalan/kl-via-way-only-exit-v4102.test.js server/jalan/kl-edge-identity-v4102.test.js server/jalan/validate-kl-pilot.test.js server/jalan/collect-kl-route-evidence.test.js
      - name: Validate production diagnostics without database writes
        run: |
          node --check server/jalan/routes.js
          node --check server/jalan/routing-diagnostics.js
          node server/jalan/routing-diagnostics.test.js

  kl-fullgraph:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      JALAN_READONLY_MONGODB_URI: ${{ secrets.JALAN_READONLY_MONGODB_URI }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify dedicated read-only connection is configured
        shell: bash
        run: |
          if [ -z "$JALAN_READONLY_MONGODB_URI" ]; then
            echo "Missing JALAN_READONLY_MONGODB_URI repository secret; no database connection attempted."
            exit 1
          fi
      - name: Create three public OSM-node smoke cases (not private GPS)
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const smoke={
            caseId:'osm_kl_directed_smoke_001',journeyType:'short-urban',
            expectedReachable:true,
            startLat:3.1315707,startLng:101.7038508,
            endLat:3.1314573,endLng:101.7038951
          };
          fs.writeFileSync('/tmp/jalan-kl-cases.json',JSON.stringify([smoke,{...smoke,caseId:'osm_kl_directed_smoke_002'},
            {caseId:'osm_kl_directed_smoke_003',journeyType:'short-urban',expectedReachable:true,
             startLat:3.130908,startLng:101.7036171,endLat:3.1313468,endLng:101.7039025}]),{mode:0o600,flag:'wx'});
          NODE
      - name: Run full-graph smoke case (partial 20-case acceptance is expected)
        shell: bash
        run: |
          set +e
          node server/jalan/run-kl-local-readonly.js /tmp/jalan-kl-cases.json /tmp/jalan-kl-sanitized.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected partial-evidence exit 2 for three-case smoke test; received $code"
            exit 1
          fi
          node - <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/jalan-kl-sanitized.json','utf8'));
          if(rows.length!==3)throw Error('Expected three route samples');
          for(const [i,r] of rows.entries()){
            if(r.caseId!==`osm_kl_directed_smoke_00${i+1}`||
               r.ok!==true||r.responseStatus!==200||r.routeModeVerified!==true||
               r.geometryContinuous!==true||r.geometryMetricsVerified!==true||
               (i<2?r.distanceMeters!==17:!(Number.isFinite(r.distanceMeters)&&r.distanceMeters>=0))||
               !Number.isFinite(r.serverTotalMs)||
               r.graphCacheHit!==(i>0))
               throw Error('Full-graph smoke evidence did not meet the expected route contract');
          }
          // Full-graph SCC counts are advisory connectivity evidence only.
          // They must be internally consistent and stable across cached runs.
          const fields=['strongNodeCount','strongEdgeCount','strongComponentCount',
            'strongLargestComponentNodes','strongSingletonComponentCount',
            'strongSourceComponentCount','strongSinkComponentCount',
            'strongInternalEdgeCount','strongCrossComponentEdgeCount'];
          for(const r of rows){
            if(r.strongTopologyDiagnosticVerified!==true||r.strongEdgeCount!==168221||
               fields.some(k=>!Number.isSafeInteger(r[k])||r[k]!==rows[0][k]))
              throw Error('Full-graph SCC diagnostic missing, invalid or inconsistent');
          }
          const [cold,warm,alternate]=rows;
          if(!Number.isFinite(warm.graphLoadMs)||warm.graphLoadMs<0)
            throw Error('Missing warm graph load measurement');
          console.log('Full-graph KL cold and warm routes passed; distance metres:',cold.distanceMeters);
          console.log('Cold graph load ms:',cold.graphLoadMs,'cold server total ms:',cold.serverTotalMs);
          console.log('Warm graph load ms:',warm.graphLoadMs,'warm server total ms:',warm.serverTotalMs);
          console.log('Distinct KL route metres:',alternate.distanceMeters,'warm server total ms:',alternate.serverTotalMs);
          console.log('Imported KL strong components:',cold.strongComponentCount,'of',cold.strongNodeCount,'nodes; cross-component directed edges:',cold.strongCrossComponentEdgeCount);
          console.log('SCC counts are connectivity diagnostics, not legal-road or route-quality acceptance.');
          console.log('Partial evidence only; 20-case manual acceptance remains pending.');
          NODE
      - name: Remove private local inputs and sanitized evidence
        if: always()
        run: rm -f /tmp/jalan-kl-cases.json /tmp/jalan-kl-sanitized.json
