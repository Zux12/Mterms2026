name: JALAN Heroku access check (read only)

on:
  push:
    branches: [jalan-v4102-routing-regression-tests]
    paths:
      - .github/workflows/jalan-heroku-access-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Verify Heroku API authentication without modifying Heroku
        shell: bash
        run: |
          node <<'NODE'
          const key=process.env.HEROKU_API_KEY;
          if(!key||key.length<16){
            console.error('HEROKU_API_KEY is not available to this workflow.');
            process.exitCode=1;
          } else {
            (async()=>{
              const headers={Accept:'application/vnd.heroku+json; version=3',
                Authorization:'Bearer '+key};
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),15000);
              try{
                const response=await fetch('https://api.heroku.com/account',{
                  headers,signal:controller.signal,redirect:'error'});
                if(response.status!==200)throw Error('Heroku account API HTTP '+response.status);
                const account=await response.json();
                if(!account?.id)throw Error('Account response missing id');
                console.log('Heroku authenticated successfully (read-only).');
                // Do not print credentials, account email, or all app names.
                for(const name of ['mterm2026','mterms2026']){
                  const app=await fetch('https://api.heroku.com/apps/'+encodeURIComponent(name),{
                    headers,signal:controller.signal,redirect:'error'});
                  if(app.status===200){
                    console.log('Existing app detected: '+name);
                  } else if(app.status===404){
                    console.log('Existing app name '+name+' not visible to account.');
                  }else throw Error('Heroku app lookup HTTP '+app.status);
                }
                console.log('No Heroku mutations or deployments performed.');
              }finally{clearTimeout(timer);}
            })().catch(err=>{
              console.error('Heroku read-only check failed: '+String(err.message).slice(0,180));
              process.exitCode=1;
            });
          }
          NODE
