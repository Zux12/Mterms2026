<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Editor’s Desk | Oil &amp; Gas</title><link rel="stylesheet" href="desk.css"><link rel="stylesheet" href="bulk.css?v=1"><script defer src="reader.js"></script><script defer src="desk.js"></script><script defer src="bulk.js?v=1"></script></head><body><header><a href="https://oilandgas.eu.com">oil &amp; gas<span>.</span></a><small>EDITORIAL OFFICE</small></header><main><h1>Editor’s Desk</h1><p id="message" role="status"></p>
<form id="login"><label>Editor password<input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form>
<section id="office" hidden><div class="bar"><label>Review queue<select id="status"><option value="pending_review">Pending review</option><option value="approved">Approved · private</option><option value="declined">Declined</option><option value="published">Published</option><option value="archived">Archived</option></select></label><button id="logout">Sign out</button></div>
<section id="bulk-controls" hidden aria-label="Bulk actions"><label class="bulk-select"><input type="checkbox" id="bulk-all"> Select all on this page</label><span id="bulk-count" role="status">0 selected</span><div class="bar"><button type="button" id="bulk-approve">Approve selected privately</button><button type="button" id="bulk-preview">Preview selected for publication</button><button type="button" id="bulk-clear">Clear selection</button></div></section>
<p id="bulk-message" role="status" aria-live="polite"></p><ul id="bulk-errors"></ul>
<ul id="queue"></ul><div class="bar"><button id="prev">Previous</button><button id="next">Next</button></div>
<section id="bulk-proof" hidden><h2>Selected publication previews</h2><p>Review these entries before publishing them publicly.</p><div id="bulk-cards"></div><button type="button" id="bulk-publish">Publish selected to website</button><button type="button" id="bulk-cancel">Close previews</button></section>
<section id="detail" hidden><h2 id="ref"></h2><button id="archive-toggle" type="button" hidden></button><details open><summary>Original submission</summary><div id="original"></div><a id="download" hidden>Download manuscript</a></details><form id="draft"><h2>Publication draft</h2><label>Title<input name="title" required maxlength="350"></label><label>Summary<textarea name="summary" required maxlength="4000"></textarea></label><label>Topic<input name="topic" required maxlength="100"></label><label>Author names in publication order<textarea name="byline" required maxlength="18000"></textarea></label><div class="bar"><button id="save">Save draft</button><button id="approve">Approve privately</button><button id="preview">Preview for publication</button></div></form>
<div id="decliner"><label>Reason sent to submitter<textarea id="reason" maxlength="2000"></textarea></label><button id="decline">Decline submission</button></div>
<section id="proof" hidden><small>PUBLIC PREVIEW</small><article id="card"></article><button id="publish">Publish to website</button></section></section></section></main></body></html>
